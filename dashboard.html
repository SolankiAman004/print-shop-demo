<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopkeeper Print Queue - Live Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css" />
  <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <nav class="bg-slate-900 text-white px-6 py-3.5 flex items-center justify-between shadow-md">
    <div class="flex items-center gap-3">
      <span class="bg-indigo-600 px-2.5 py-1 rounded-lg font-bold text-sm">QP</span>
      <h1 class="font-bold text-lg">Sharma Xerox — Live Counter Dashboard</h1>
    </div>
    <span class="inline-flex items-center gap-2 bg-emerald-500/20 text-emerald-300 px-3 py-1 rounded-full text-xs font-semibold">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> Cloud Live Connected
    </span>
  </nav>

  <div class="max-w-7xl mx-auto p-6 space-y-6">
    <!-- KPI Cards -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
        <p class="text-xs font-semibold text-slate-500 uppercase">Pending Jobs</p>
        <p id="kpiPending" class="text-3xl font-extrabold text-amber-600 mt-1">0</p>
      </div>
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
        <p class="text-xs font-semibold text-slate-500 uppercase">Printed Today</p>
        <p id="kpiPrinted" class="text-3xl font-extrabold text-emerald-600 mt-1">0</p>
      </div>
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
        <p class="text-xs font-semibold text-slate-500 uppercase">Expected Cash Today</p>
        <p id="kpiCash" class="text-3xl font-extrabold text-indigo-600 mt-1">₹0</p>
      </div>
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
        <p class="text-xs font-semibold text-slate-500 uppercase">Privacy Auto-Delete</p>
        <p class="text-sm font-bold text-slate-700 mt-2">Active (60 Min Policy)</p>
        <p class="text-xs text-slate-400 mt-0.5">Direct print • Zero clutter</p>
      </div>
    </div>

    <!-- DataTable -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
      <table id="jobsTable" class="w-full text-sm text-left">
        <thead class="bg-slate-50 text-slate-600 uppercase text-xs">
          <tr>
            <th>Token</th>
            <th>Time</th>
            <th>Customer</th>
            <th>Document & Pages</th>
            <th>Print Settings</th>
            <th>Notes</th>
            <th>Bill</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, query, orderBy, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getStorage, ref, deleteObject } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAE5POEDBJhbAdwHriuYiut9g9Z8L_JKGA",
      authDomain: "print-shop-demo.firebaseapp.com",
      projectId: "print-shop-demo",
      storageBucket: "print-shop-demo.firebasestorage.app",
      messagingSenderId: "777021975636",
      appId: "1:777021975636:web:1427ffea10f5c5adb391c1",
      measurementId: "G-K9JPYQNQ6S"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    let table = $('#jobsTable').DataTable({ ordering: false, pageLength: 10 });
    let isFirstLoad = true;

    function playDing() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.5);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.5);
    }

    window.printJob = async function(id, fileUrl) {
      window.open(fileUrl, '_blank');
      await updateDoc(doc(db, "print_jobs", id), { status: 'PRINTED' });
    };

    window.deleteJob = async function(id, storagePath) {
      if (storagePath) {
        await deleteObject(ref(storage, storagePath)).catch(() => {});
      }
      await deleteDoc(doc(db, "print_jobs", id));
    };

    const q = query(collection(db, "print_jobs"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      if (!isFirstLoad && snapshot.docChanges().some(c => c.type === 'added')) {
        playDing();
      }
      isFirstLoad = false;

      let pending = 0, printed = 0, cash = 0;
      table.clear();

      snapshot.forEach((docSnap) => {
        const job = docSnap.data();
        const id = docSnap.id;

        if (job.status === 'PENDING') pending++;
        if (job.status === 'PRINTED') { printed++; cash += job.total; }

        const colorBadge = job.colorMode === 'COLOR'
          ? `<span class="bg-orange-100 text-orange-700 font-bold px-2 py-0.5 rounded text-xs">COLOR</span>`
          : `<span class="bg-slate-200 text-slate-700 font-bold px-2 py-0.5 rounded text-xs">B&W</span>`;

        const sideBadge = job.printSide === 'DOUBLE'
          ? `<span class="bg-blue-100 text-blue-700 font-bold px-2 py-0.5 rounded text-xs">DOUBLE-SIDED</span>`
          : `<span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded text-xs">Single</span>`;

        const notesHtml = job.notes
          ? `<span class="bg-amber-100 text-amber-800 px-2 py-1 rounded text-xs font-medium">${job.notes}</span>`
          : `<span class="text-slate-400 text-xs">—</span>`;

        const statusBadge = job.status === 'PENDING'
          ? `<span class="bg-amber-100 text-amber-700 font-bold px-2.5 py-1 rounded-full text-xs">Pending</span>`
          : `<span class="bg-emerald-100 text-emerald-700 font-bold px-2.5 py-1 rounded-full text-xs">Printed</span>`;

        const actionsHtml = `
          <div class="flex items-center gap-1.5">
            <button onclick="printJob('${id}', '${job.fileUrl}')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-3 py-1.5 rounded-lg text-xs">
              ${job.status === 'PENDING' ? '🖨️ Print' : '↻ Reprint'}
            </button>
            <button onclick="deleteJob('${id}', '${job.storagePath}')" class="bg-red-50 hover:bg-red-100 text-red-600 font-semibold px-2.5 py-1.5 rounded-lg text-xs">
              🗑️
            </button>
          </div>
        `;

        table.row.add([
          `<span class="font-extrabold text-indigo-600">${job.token}</span>`,
          `<span class="text-xs text-slate-500">${job.time}</span>`,
          `<span class="font-semibold">${job.customerName}</span>`,
          `<div><div class="font-medium truncate max-w-[160px]">${job.fileName}</div><div class="text-xs text-slate-500">${job.pages} pg • Range: ${job.pageRange}</div></div>`,
          `<div class="space-x-1">${colorBadge} ${sideBadge} <span class="font-bold text-xs ml-1">×${job.copies}</span></div>`,
          notesHtml,
          `<span class="font-bold text-slate-900">₹${job.total}</span>`,
          statusBadge,
          actionsHtml
        ]);
      });

      document.getElementById('kpiPending').textContent = pending;
      document.getElementById('kpiPrinted').textContent = printed;
      document.getElementById('kpiCash').textContent = `₹${cash}`;
      table.draw();
    });
  </script>
</body>
</html>
