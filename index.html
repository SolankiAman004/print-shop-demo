<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickPrint - Customer Upload</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
    <!-- Header -->
    <div class="bg-indigo-600 p-5 text-white text-center">
      <h1 class="text-xl font-bold">Sharma Xerox & Print Hub</h1>
      <p class="text-indigo-100 text-xs mt-1">Scan • Upload • Collect at Counter</p>
      <div class="mt-3 inline-flex items-center gap-1.5 bg-emerald-500/20 text-emerald-100 text-xs px-3 py-1 rounded-full">
        <span>🔒 Privacy Safe: Auto-deletes in 60 mins</span>
      </div>
    </div>

    <!-- Form -->
    <form id="printForm" class="p-5 space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Your Name / Mobile Last 4 Digits *</label>
        <input type="text" id="customerName" required placeholder="e.g. Rahul - 8842"
          class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Select Document (PDF, JPG, PNG) *</label>
        <label class="flex flex-col items-center justify-center w-full h-28 border-2 border-dashed border-indigo-300 rounded-xl cursor-pointer bg-indigo-50/50 hover:bg-indigo-50 transition">
          <div class="text-center px-3">
            <p id="fileLabel" class="text-sm font-medium text-indigo-700">Tap to choose file</p>
            <p id="pageInfo" class="text-xs text-slate-500 mt-1">Auto-detects PDF page count</p>
          </div>
          <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png" required class="hidden" />
        </label>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Print Color</label>
        <div class="grid grid-cols-2 gap-2.5">
          <label class="cursor-pointer">
            <input type="radio" name="colorMode" value="BW" checked class="peer hidden" />
            <div class="p-3 rounded-xl border-2 border-slate-200 peer-checked:border-indigo-600 peer-checked:bg-indigo-50 text-center">
              <div class="font-bold text-slate-800 text-sm">Black & White</div>
              <div class="text-xs text-slate-500">₹2 / page</div>
            </div>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="colorMode" value="COLOR" class="peer hidden" />
            <div class="p-3 rounded-xl border-2 border-slate-200 peer-checked:border-orange-500 peer-checked:bg-orange-50 text-center">
              <div class="font-bold text-orange-600 text-sm">Full Color</div>
              <div class="text-xs text-slate-500">₹10 / page</div>
            </div>
          </label>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Paper Sides</label>
        <div class="grid grid-cols-2 gap-2.5">
          <label class="cursor-pointer">
            <input type="radio" name="printSide" value="SINGLE" checked class="peer hidden" />
            <div class="p-2.5 rounded-xl border-2 border-slate-200 peer-checked:border-indigo-600 peer-checked:bg-indigo-50 text-center text-sm font-semibold">Single-Sided</div>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="printSide" value="DOUBLE" class="peer hidden" />
            <div class="p-2.5 rounded-xl border-2 border-slate-200 peer-checked:border-blue-600 peer-checked:bg-blue-50 text-center text-sm font-semibold text-blue-700">Double-Sided</div>
          </label>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Copies</label>
          <input type="number" id="copies" value="1" min="1" max="500" class="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold text-sm" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Pages (Optional)</label>
          <input type="text" id="pageRange" placeholder="All (or 1-5)" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm" />
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Extra Instructions (Optional)</label>
        <input type="text" id="notes" placeholder="e.g. Spiral binding, thick paper..." class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm" />
      </div>

      <div class="pt-2 border-t border-slate-200 flex items-center justify-between">
        <div>
          <span class="text-xs text-slate-500 block">Estimated Total</span>
          <span id="totalDisplay" class="text-2xl font-extrabold text-slate-900">₹0</span>
        </div>
        <button type="submit" id="submitBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-3 rounded-xl shadow-lg transition">
          Send to Printer →
        </button>
      </div>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAE5POEDBJhbAdwHriuYiut9g9Z8L_JKGA",
      authDomain: "print-shop-demo.firebaseapp.com",
      projectId: "print-shop-demo",
      storageBucket: "print-shop-demo.firebasestorage.app",
      messagingSenderId: "777021975636",
      appId: "1:777021975636:web:1427ffea10f5c5adb391c1",
      measurementId: "G-K9JPYQNQ6S"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let detectedPages = 0;
    let selectedFile = null;

    function calculateTotal() {
      const copies = parseInt(document.getElementById('copies').value) || 1;
      const color = document.querySelector('input[name="colorMode"]:checked').value;
      const rate = color === 'COLOR' ? 10 : 2;
      const total = detectedPages * copies * rate;
      document.getElementById('totalDisplay').textContent = `₹${total}`;
      return total;
    }

    document.querySelectorAll('input[name="colorMode"], #copies').forEach(el => {
      el.addEventListener('change', calculateTotal);
      el.addEventListener('input', calculateTotal);
    });

    document.getElementById('fileInput').addEventListener('change', async function(e) {
      selectedFile = e.target.files[0];
      if (!selectedFile) return;

      document.getElementById('fileLabel').textContent = selectedFile.name;

      if (selectedFile.type === 'application/pdf') {
        const arrayBuffer = await selectedFile.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        detectedPages = pdf.numPages;
        document.getElementById('pageInfo').textContent = `✅ ${detectedPages} page(s) detected`;
      } else {
        detectedPages = 1;
        document.getElementById('pageInfo').textContent = `✅ Image file (1 page)`;
      }
      calculateTotal();
    });

    document.getElementById('printForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      if (!selectedFile) return;

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = "Uploading...";

      try {
        const storagePath = `prints/${Date.now()}_${selectedFile.name}`;
        const storageRef = ref(storage, storagePath);
        await uploadBytes(storageRef, selectedFile);
        const fileUrl = await getDownloadURL(storageRef);

        const token = `#${Math.floor(100 + Math.random() * 900)}`;
        const total = calculateTotal();

        await addDoc(collection(db, "print_jobs"), {
          token: token,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          customerName: document.getElementById('customerName').value,
          fileName: selectedFile.name,
          fileUrl: fileUrl,
          storagePath: storagePath,
          pages: detectedPages,
          copies: parseInt(document.getElementById('copies').value) || 1,
          colorMode: document.querySelector('input[name="colorMode"]:checked').value,
          printSide: document.querySelector('input[name="printSide"]:checked').value,
          pageRange: document.getElementById('pageRange').value || 'All',
          notes: document.getElementById('notes').value || '',
          total: total,
          status: 'PENDING',
          createdAt: serverTimestamp()
        });

        Swal.fire({
          icon: 'success',
          title: `Token ${token} Sent!`,
          html: `Show this token at the counter.<br><b>Total Amount: ₹${total}</b>`,
          confirmButtonColor: '#4f46e5'
        });

        this.reset();
        selectedFile = null;
        detectedPages = 0;
        document.getElementById('fileLabel').textContent = "Tap to choose file";
        document.getElementById('pageInfo').textContent = "Auto-detects PDF page count";

        document.getElementById('totalDisplay').textContent = "₹0";
} catch (err) {
Swal.fire('Upload Failed', err.message, 'error');
} finally {
btn.disabled = false;
btn.textContent = "Send to Printer →";
}
});
  </script>
</body>
</html>
